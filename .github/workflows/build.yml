name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # attach installers to releases on v* tags
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # LibFPV (Betaflight + physics) -> WebAssembly
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.12
          actions-cache-folder: emsdk-cache
      - name: Build earthflyer_fpv.wasm
        run: |
          emcmake cmake -S native -B build/wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build/wasm -j4
          ls -la web/wasm
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: web/wasm/

  # Native check of the ENU conventions against real libfpv
  glue-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build libfpv (native) and run the glue test
        run: |
          sudo apt-get update && sudo apt-get install -y cmake build-essential
          cmake -S third_party/libfpv -B build/native -DLIBFPV_WITH_SDL=OFF -DLIBFPV_BUILD_TESTS=OFF -DLIBFPV_BUILD_EXAMPLES=OFF
          cmake --build build/native -j4
          cc -O1 -Ithird_party/libfpv/include native/test_glue.c native/earthflyer_fpv.c \
             -Lbuild/native -lfpv -lm -Wl,-rpath,$PWD/build/native -o build/test_glue
          cd build && ./test_glue | grep -v '^\[libfpv\]'

  # The real app + LibFPV WebAssembly in headless Chrome
  browser-test:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: web/wasm/
      - run: scripts/fetch-cesium.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke test (drone mode with LibFPV)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          python3 -m http.server -d web 8765 &
          sleep 2
          mkdir -p shots
          EXPECT_LIBFPV=1 node tools/smoke-test.mjs http://localhost:8765/ shots 2>&1 | tee smoke.log || {
            tail -n 30 smoke.log | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error title=smoke::$line"; done
            exit 1
          }
          grep -o '"name": "[^"]*"\|"version": "[^"]*"\|"simTimeAdvanced": [a-z]*\|"osdPixels": [0-9]*\|"rainierSummitM": [0-9a-z]*\|"drawCommands": [0-9]*\|"closedWithF8": [a-z]*\|"buildings": [0-9]*\|"tilesWithTexture": [0-9]*\|"textureLooksReal": [a-z]*' smoke.log | sed 's/^/::notice title=smoke::/'
      - name: Buildings test (offline, synthetic tiles)
        run: |
          node tools/buildings-test.mjs http://localhost:8765/ shots 2>&1 | tee buildings.log || {
            echo "::error title=buildings::$(tail -n 25 buildings.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: shots/

  # Static site on GitHub Pages
  web:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: web/wasm/
      - run: scripts/fetch-cesium.sh
      - uses: actions/upload-artifact@v4
        with:
          name: earth-flyer-web
          path: web/
      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

  pages:
    if: github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Desktop apps: Windows, macOS, Linux
  desktop:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned builds
    steps:
      - uses: actions/checkout@v4
      # The exact site the web job assembled on Linux (Cesium + LibFPV wasm)
      - uses: actions/download-artifact@v4
        with:
          name: earth-flyer-web
          path: web/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package
        working-directory: desktop
        shell: bash
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee ../package.log
          npm run dist 2>&1 | tee -a ../package.log || {
            msg=$(grep -v "npm warn" ../package.log | tail -n 30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=package::$msg"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: earth-flyer-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
